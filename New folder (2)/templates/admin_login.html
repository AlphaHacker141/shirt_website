{% extends 'base.html' %}

{% block content %}
<div class="container mx-auto px-4 py-20 flex justify-center">
    <div class="w-full max-w-md bg-gray-900 p-8 rounded-2xl border border-gray-800">
        <h2 class="text-3xl font-bold mb-6 text-center">Admin Login</h2>
        <form method="POST" action="{{ url_for('admin_login') }}">
            <div class="mb-4">
                <label class="block text-gray-400 mb-2">Username</label>
                <input type="text" name="username"
                    class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 text-white focus:border-purple-500 focus:outline-none"
                    required>
            </div>
            <div class="mb-6">
                <label class="block text-gray-400 mb-2">Password</label>
                <input type="password" name="password"
                    class="w-full bg-gray-800 border border-gray-700 rounded-lg px-4 py-3 text-white focus:border-purple-500 focus:outline-none"
                    required>
            </div>
            <button type="submit"
                class="w-full bg-purple-600 text-white font-bold py-3 rounded-lg hover:bg-purple-700 transition">Login</button>
        </form>
    </div>
</div>
{% endblock %}
