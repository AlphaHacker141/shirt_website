<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shahil Fashion | Premium T-Shirts</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #050505;
            color: #ffffff;
        }
        .neon-text {
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">
    <!-- Navbar -->
    <nav class="border-b border-gray-800 bg-black/80 backdrop-blur-md sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4 flex justify-between items-center">
            <a href="/" class="text-2xl font-bold tracking-tighter uppercase neon-text">Shahil<span class="text-purple-500">Fashion</span></a>
            <div class="space-x-6 hidden md:flex">
                <a href="/" class="hover:text-purple-400 transition">Home</a>
                <a href="#new-arrivals" class="hover:text-purple-400 transition">New Arrivals</a>
                <a href="#contact" class="hover:text-purple-400 transition">Contact</a>
            </div>
            <!-- Mobile Menu Button (simplified) -->
            <button class="md:hidden text-white">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path></svg>
            </button>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow">
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="container mx-auto px-4 mt-4">
                    {% for message in messages %}
                        <div class="bg-purple-900/50 border border-purple-500 text-white px-4 py-3 rounded relative" role="alert">
                            <span class="block sm:inline">{{ message }}</span>
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}
        
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="bg-black border-t border-gray-800 mt-12 py-8">
        <div class="container mx-auto px-4 text-center text-gray-400">
            <p>&copy; 2025 Shahil Fashion. All rights reserved.</p>
            <div class="mt-4 space-x-4">
                <a href="#" class="hover:text-white">Instagram</a>
                <a href="#" class="hover:text-white">WhatsApp</a>
            </div>
        </div>
    </footer>
</body>
</html>
